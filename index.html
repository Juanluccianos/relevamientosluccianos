<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Relevamientos">
<title>Relevamientos Lucciano's</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Relevamientos Lucciano's
   Monocromo como Viáticos (negro, blanco, grises). Manrope para títulos y números, Inter para texto.
   Firma propia: el anillo de puntaje, que se llena según la nota y toma el color de la escala. */
:root {
  --ink: #0a0a0a;
  --ink-2: #1d1d20;
  --soft: #5c5d61;
  --mute: #8d8e93;
  --paper: #f2f2f3;
  --paper-2: #e6e6e8;
  --white: #ffffff;
  --line: #dcdcdf;

  --aprobado: #1c7a45;
  --observado: #b3791f;
  --urgente: #c4531b;
  --critico: #b3261e;
  --sd: #b4b5b9;

  /* versiones claras para usar sobre negro */
  --aprobado-cl: #52d08c;
  --observado-cl: #f1b95a;
  --urgente-cl: #ff9357;
  --critico-cl: #ff6b62;

  --shadow: 0 1px 2px rgba(10,10,10,.05), 0 6px 20px rgba(10,10,10,.07);
  --r: 16px;
  --r-s: 11px;
  --nav-h: 66px;
  --top-h: 60px;
  --font-d: 'Manrope', 'Inter', system-ui, sans-serif;
  --font-b: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { overflow-x: clip; }
body {
  font-family: var(--font-b);
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overflow-x: clip;
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; }
:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
svg { flex: none; }
h1, h2, h3 { font-family: var(--font-d); letter-spacing: -.01em; }

/* ============ barra superior */
.top {
  position: sticky; top: 0; z-index: 20;
  display: grid; grid-template-columns: 110px 1fr 110px; align-items: center;
  height: calc(var(--top-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 10px 0;
  background: var(--ink); color: var(--white);
}
.top h1 { margin: 0; font-size: 17px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-btn {
  position: relative; display: grid; place-items: center;
  width: 40px; height: 40px; border-radius: 11px;
  background: rgba(255,255,255,.08); color: var(--white); text-decoration: none; border: 0; cursor: pointer;
}
.top-btn:hover { background: rgba(255,255,255,.16); }
.top-btn svg { width: 21px; height: 21px; }
.top > :last-child { justify-self: end; }
.marca { display: flex; align-items: center; height: 100%; padding-left: 4px; }
.marca img { height: 36px; width: auto; max-width: 104px; object-fit: contain; }
.logo-txt { font-family: var(--font-d); font-weight: 800; font-style: italic; white-space: nowrap; }
.marca .logo-txt { font-size: 15px; color: var(--white); }
.badge {
  position: absolute; top: -4px; right: -4px; min-width: 19px; height: 19px; padding: 0 5px;
  border-radius: 10px; background: var(--white); color: var(--ink);
  font-size: 11px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--ink);
}

/* ============ navegación inferior */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: space-around;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(255,255,255,.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
.nav a {
  position: relative; flex: 1; max-width: 140px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  text-decoration: none; color: var(--mute); font-size: 11.5px; font-weight: 600;
}
.nav a svg { width: 23px; height: 23px; }
.nav a.activo { color: var(--ink); }
.nav a.activo::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ink); }

.vista { max-width: 760px; margin: 0 auto; padding: 18px 16px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom)); }

/* ============ piezas comunes */
.card { background: var(--white); border-radius: var(--r); padding: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.bloque { margin-top: 28px; }
.bloque > h2, .h-bloque { font-size: 16px; font-weight: 800; margin: 0 0 12px; }
.sub { color: var(--soft); font-size: 13.5px; margin: 2px 0 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--white); color: var(--ink);
  font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: transform .06s, filter .15s, background .15s;
}
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; }
.btn.primario { background: var(--ink); color: var(--white); border-color: var(--ink); }
.btn.primario:hover { filter: brightness(1.25); }
.btn.blanco { background: var(--white); color: var(--ink); border-color: var(--white); }
.btn.fantasma { background: transparent; border-color: transparent; color: var(--soft); }
.btn.fantasma:hover { color: var(--critico); }
.btn.ancho { width: 100%; }
.btn.chico { min-height: 38px; padding: 0 14px; font-size: 13.5px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: default; }
.link-sutil { color: rgba(255,255,255,.65); font-size: 14px; text-align: center; }
.link-sutil:hover { color: var(--white); }
.error { color: var(--critico); font-weight: 600; font-size: 13.5px; margin: 0; }
.vacio { text-align: center; padding: 44px 16px; color: var(--soft); }
.vacio p { margin: 0 0 18px; }
.vacio-ico { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: var(--white); margin-bottom: 14px; }
.vacio-ico svg { width: 26px; height: 26px; }

.form { display: grid; gap: 15px; }
.form label { display: grid; gap: 6px; font-weight: 600; font-size: 13px; color: var(--soft); }
.form strong { font-family: var(--font-d); font-size: 16px; color: var(--ink); }
input[type=text], input[type=email], input[type=password], input[type=search], input[type=month], input[type=date], input:not([type]), select, textarea {
  width: 100%; min-height: 48px; padding: 11px 14px; border-radius: var(--r-s);
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); transition: border-color .15s, background .15s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); background: var(--white); }
textarea { min-height: 120px; resize: vertical; }
.check { display: flex !important; align-items: flex-start; gap: 10px; font-weight: 500 !important; color: var(--ink) !important; }
.check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--ink); }
.clave-wrap { position: relative; display: block; }
.clave-wrap input { padding-right: 52px; }
.ojo { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); width: 38px; height: 38px; display: grid; place-items: center; border: 0; background: none; color: var(--mute); cursor: pointer; border-radius: 9px; }
.ojo:hover { color: var(--ink); background: rgba(0,0,0,.05); }
.ojo svg { width: 20px; height: 20px; }

/* ============ anillo de puntaje */
.anillo { position: relative; display: inline-grid; place-items: center; flex: none; }
.anillo svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.anillo .pista { fill: none; stroke: var(--paper-2); stroke-width: 4.2; }
.anillo .arco { fill: none; stroke: var(--sd); stroke-width: 4.2; stroke-linecap: round; transition: stroke-dasharray .45s ease; }
.anillo.aprobado .arco { stroke: var(--aprobado); }
.anillo.observado .arco { stroke: var(--observado); }
.anillo.urgente .arco { stroke: var(--urgente); }
.anillo.critico .arco { stroke: var(--critico); }
.anillo b { position: relative; font-family: var(--font-d); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1; }
.anillo.sd b { color: var(--mute); font-weight: 700; }
.anillo.s { width: 48px; height: 48px; }
.anillo.s b { font-size: 12.5px; }
.anillo.m { width: 60px; height: 60px; }
.anillo.m b { font-size: 15px; }
.anillo.l { width: 124px; height: 124px; }
.anillo.l .pista, .anillo.l .arco { stroke-width: 3.4; }
.anillo.l b { font-size: 30px; }

.chip-escala { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--paper-2); color: var(--soft); }
.chip-escala::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip-escala.aprobado { background: #e7f5ec; color: var(--aprobado); }
.chip-escala.observado { background: #fbf1df; color: var(--observado); }
.chip-escala.urgente { background: #fcebe1; color: var(--urgente); }
.chip-escala.critico { background: #fbe6e4; color: var(--critico); }
.punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--sd); }
.punto.aprobado { background: var(--aprobado); } .punto.observado { background: var(--observado); }
.punto.urgente { background: var(--urgente); } .punto.critico { background: var(--critico); }
.delta { display: inline-flex; align-items: center; gap: 2px; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.delta svg { width: 13px; height: 13px; }
.delta.sube { color: var(--aprobado); } .delta.baja { color: var(--critico); }

/* ============ tarjeta negra destacada */
.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(155deg, var(--ink) 0%, #26262a 100%); color: var(--white);
  border-radius: 20px; padding: 22px 20px; box-shadow: var(--shadow);
}
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; border: 28px solid rgba(255,255,255,.035); pointer-events: none; }
.hero > * { position: relative; }
.hero-sub { margin: 0; font-size: 13px; color: rgba(255,255,255,.6); font-weight: 500; }
.hero-titulo { margin: 2px 0 6px; font-size: 25px; font-weight: 800; line-height: 1.15; }
.hero-meta { margin: 2px 0; font-size: 13.5px; color: rgba(255,255,255,.72); }
.hero-ficha { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.hero-ficha .chip-escala { margin-top: 12px; }
.hero .anillo .pista { stroke: rgba(255,255,255,.12); }
.hero .anillo.aprobado .arco { stroke: var(--aprobado-cl); }
.hero .anillo.observado .arco { stroke: var(--observado-cl); }
.hero .anillo.urgente .arco { stroke: var(--urgente-cl); }
.hero .anillo.critico .arco { stroke: var(--critico-cl); }
.hero .anillo b { color: var(--white); }
.hero .anillo.sd b { color: rgba(255,255,255,.55); }
.hero .chip-escala { background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); }
.hero .chip-escala.aprobado { color: var(--aprobado-cl); } .hero .chip-escala.observado { color: var(--observado-cl); }
.hero .chip-escala.urgente { color: var(--urgente-cl); } .hero .chip-escala.critico { color: var(--critico-cl); }
.hero-num { font-family: var(--font-d); font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.hero-num small { font-size: 20px; color: rgba(255,255,255,.5); font-weight: 700; }
.hero-lbl { display: block; font-size: 13px; color: rgba(255,255,255,.65); margin-top: 4px; }
.hero-avance { margin-top: 16px; }
.hero-nota, .hero-alerta { display: flex; gap: 8px; align-items: flex-start; margin: 14px 0 0; font-size: 13.5px; color: rgba(255,255,255,.8); }
.hero-alerta { color: var(--observado-cl); font-weight: 600; }
.hero-nota svg, .hero-alerta svg { width: 18px; height: 18px; margin-top: 1px; }
.hero-notas { margin: 0; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.12); font-size: 14px; color: rgba(255,255,255,.85); }
.hero-resumen { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: center; }
.hero-bloque { display: flex; align-items: center; gap: 16px; }
.hero-bloque .chip-escala { margin-top: 8px; }
.hero-cob { flex: 1; }
.hero-cob .barra { margin: 12px 0 2px; }
@media (max-width: 560px) {
  .hero-resumen { grid-template-columns: 1fr; }
  .hero-bloque + .hero-bloque { padding-top: 16px; border-top: 1px solid rgba(255,255,255,.1); }
}

.barra { height: 7px; border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.barra span { display: block; height: 100%; background: var(--ink); border-radius: 4px; transition: width .35s; }
.barra.clara { background: rgba(255,255,255,.14); margin-top: 12px; }
.barra.clara span { background: var(--white); }

/* ============ listas */
.lista { background: var(--white); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.fila { display: flex; align-items: center; gap: 12px; padding: 11px 14px; text-decoration: none; border-top: 1px solid var(--paper-2); }
.fila:first-child { border-top: 0; }
a.fila:hover, .fila-link:hover { background: #fafafa; }
.fila-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-decoration: none; margin: -11px 0 -11px -14px; padding: 11px 0 11px 14px; }
.fila-txt { flex: 1; min-width: 0; display: grid; gap: 1px; }
.fila-txt strong { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fila-txt small { color: var(--soft); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fila-der { display: flex; align-items: center; gap: 8px; flex: none; }
.flecha { color: var(--mute); display: grid; }
.flecha svg { width: 18px; height: 18px; }
.fila .btn { flex-shrink: 0; }

.buscador { display: grid; gap: 12px; margin-bottom: 16px; }
.buscar { position: relative; display: block; }
.buscar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--mute); pointer-events: none; }
.buscar input { padding-left: 44px; background: var(--white); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--white); font-weight: 600; font-size: 13px; cursor: pointer; color: var(--soft); }
.chip.activo { background: var(--ink); border-color: var(--ink); color: var(--white); }
.aviso { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r); background: var(--white); border: 1.5px dashed var(--mute); margin-top: 16px; text-decoration: none; }
.aviso strong { display: block; font-family: var(--font-d); }
.aviso > div { flex: 1; }

/* ============ capítulos */
.cap-fila { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 12px 0; border-top: 1px solid var(--paper-2); align-items: center; }
.cap-fila:first-child { border-top: 0; padding-top: 2px; }
.cap-fila .barra { grid-column: 1 / -1; height: 6px; }
.cap-fila .barra span { background: var(--sd); }
.cap-fila .barra span.aprobado { background: var(--aprobado); } .cap-fila .barra span.observado { background: var(--observado); }
.cap-fila .barra span.urgente { background: var(--urgente); } .cap-fila .barra span.critico { background: var(--critico); }
.cap-fila b { font-family: var(--font-d); font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.txt-aprobado { color: var(--aprobado); } .txt-observado { color: var(--observado); }
.txt-urgente { color: var(--urgente); } .txt-critico { color: var(--critico); } .txt-sd { color: var(--mute); }

/* ============ relevar */
.rel-head {
  position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top)); z-index: 10;
  margin: -18px -16px 0; padding: 12px 16px; background: rgba(255,255,255,.97);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.rel-head-row { display: flex; align-items: center; gap: 12px; }
.rel-head-row > div:first-child { flex: 1; min-width: 0; display: grid; gap: 2px; }
.rel-head strong { font-family: var(--font-d); font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rel-head small { display: flex; align-items: center; gap: 5px; color: var(--soft); font-size: 12.5px; }
.rel-head small svg { width: 14px; height: 14px; }
.rel-head small.lejos { color: var(--urgente); font-weight: 700; }
.rel-head .prog { font-weight: 600; color: var(--ink); }
.rel-head .barra { height: 4px; margin-top: 10px; }
.cap { margin-top: 26px; }
.cap h2 { font-size: 16px; font-weight: 800; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.cap h2 span { font-size: 13px; color: var(--soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.item { background: var(--white); border: 1.5px solid var(--line); border-radius: var(--r); padding: 15px; margin-bottom: 10px; transition: border-color .2s, box-shadow .2s; }
.item.falta { border-color: var(--urgente); box-shadow: 0 0 0 3px rgba(196,83,27,.15); }
.item p { margin: 0 0 12px; font-weight: 500; }
.tag-crit { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--ink); color: var(--white); font-size: 11px; font-weight: 700; vertical-align: 1px; }
.opciones { display: grid; grid-template-columns: 1fr 1fr 1.15fr .75fr; gap: 6px; }
.op { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 4px; white-space: nowrap; font-size: 13.5px !important; min-height: 50px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--white); font-weight: 600; font-size: 14px; cursor: pointer; color: var(--soft); transition: background .15s, color .15s, border-color .15s; }
.op svg { width: 17px; height: 17px; }
.op:hover { border-color: var(--mute); color: var(--ink); }
.op.ok.sel { background: var(--aprobado); border-color: var(--aprobado); color: var(--white); }
.op.fail.sel { background: var(--critico); border-color: var(--critico); color: var(--white); }
.op.na.sel { background: var(--ink); border-color: var(--ink); color: var(--white); }
.item-extra { display: flex; gap: 8px; margin-top: 10px; }
.item-extra .coment { flex: 1 1 auto; width: auto; min-width: 0; min-height: 44px; margin: 0; }
.foto-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: var(--r-s); border: 1.5px solid var(--line); background: var(--white); font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; color: var(--ink); }
.foto-btn:hover { border-color: var(--ink); }
.foto-btn svg { width: 18px; height: 18px; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs:not(:empty) { margin-top: 10px; }
.thumb { position: relative; width: 76px; height: 76px; border-radius: 10px; overflow: hidden; background: var(--paper-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 12px; border: 0; background: rgba(10,10,10,.8); color: var(--white); display: grid; place-items: center; cursor: pointer; }
.thumb button svg { width: 13px; height: 13px; }
.pie-rel { margin-top: 30px; display: grid; gap: 10px; }
.pie-rel .form { margin-bottom: 6px; }

/* ============ detalle */
.resp { padding: 13px 0; border-top: 1px solid var(--paper-2); }
.resp:first-child { border-top: 0; }
.resp-top { display: flex; gap: 11px; align-items: flex-start; }
.resp-top p { margin: 0; flex: 1; }
.ico { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--white); }
.ico svg { width: 14px; height: 14px; }
.ico.ok { background: var(--aprobado); } .ico.fail { background: var(--critico); } .ico.na { background: var(--sd); }
.coment { margin: 6px 0 0 37px; padding: 8px 12px; border-radius: 10px; background: var(--paper); color: var(--soft); font-size: 13.5px; }
.resp .thumbs { margin-left: 37px; }
.thumb a { display: block; height: 100%; }
details.card { padding: 0 16px; }
details summary { cursor: pointer; font-family: var(--font-d); font-weight: 700; padding: 15px 0; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--mute); border-bottom: 2px solid var(--mute); transform: rotate(45deg); transition: transform .2s; margin-right: 4px; }
details[open] summary::after { transform: rotate(-135deg); }
details[open] { padding-bottom: 8px; }

/* ============ resumen */
.periodo { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.periodo input { max-width: 210px; min-height: 42px; background: var(--white); }
.dist { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 3px; margin: 4px 0 16px; }
.dist span { display: block; height: 100%; border-radius: 3px; }
.dist .aprobado, .leyenda i.aprobado { background: var(--aprobado); }
.dist .observado, .leyenda i.observado { background: var(--observado); }
.dist .urgente, .leyenda i.urgente { background: var(--urgente); }
.dist .critico, .leyenda i.critico { background: var(--critico); }
.dist .sd, .leyenda i.sd { background: var(--paper-2); }
.leyenda { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 18px; font-size: 13.5px; }
.leyenda div { display: flex; align-items: center; gap: 9px; }
.leyenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.leyenda b { margin-left: auto; font-family: var(--font-d); font-weight: 800; font-variant-numeric: tabular-nums; }
.tend { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; align-items: end; height: 170px; padding-top: 8px; border-bottom: 1px solid var(--line); }
.tend-col { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.tend-bar { display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 6px 6px 0 0; overflow: hidden; min-height: 2px; }
.tend-bar span { display: block; }
.tend-lbl { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; text-align: center; font-size: 11.5px; color: var(--mute); margin-top: 8px; }
.tend-lbl span { text-transform: capitalize; }
.tend-lbl b { display: block; color: var(--ink); font-family: var(--font-d); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabla th { text-align: left; font-size: 12px; color: var(--mute); font-weight: 600; padding: 4px 8px 10px; border-bottom: 1px solid var(--line); }
.tabla td { padding: 12px 8px; border-bottom: 1px solid var(--paper-2); vertical-align: middle; }
.tabla tr:last-child td { border-bottom: 0; }
.tabla .der { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabla b { font-family: var(--font-d); font-weight: 800; }
.mini-barra { width: 64px; height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
.mini-barra span { display: block; height: 100%; background: var(--ink); }
.scroll-x { overflow-x: auto; }
.sup-fila { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; padding: 13px 0; border-top: 1px solid var(--paper-2); align-items: center; }
.sup-fila:first-child { border-top: 0; padding-top: 2px; }
.sup-fila strong { font-weight: 600; }
.sup-fila .sup-prom { font-family: var(--font-d); font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.sup-fila .sup-cump { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
.sup-fila .barra { flex: 1; height: 6px; }
details.lista-plegable { padding: 0; }
details.lista-plegable summary { padding: 15px 16px; }
details.lista-plegable .fila:first-of-type { border-top: 1px solid var(--paper-2); }
.dos-col { display: grid; gap: 28px; }
@media (min-width: 700px) { .dos-col { grid-template-columns: 1fr 1fr; } }
.item-fail { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--paper-2); align-items: flex-start; }
.item-fail:first-child { border-top: 0; padding-top: 2px; }
.item-fail b { min-width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--ink); color: var(--white); font-family: var(--font-d); font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.item-fail small { display: block; color: var(--mute); font-size: 12.5px; margin-top: 2px; }

/* ============ admin */
.tabs { display: flex; gap: 4px; background: var(--paper-2); padding: 4px; border-radius: 13px; margin-bottom: 18px; }
.tabs button { flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: none; font-weight: 600; cursor: pointer; color: var(--soft); display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.tabs button svg { width: 18px; height: 18px; }
.tabs button.activo { background: var(--white); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.plantilla { font-size: 12.5px; color: var(--soft); background: var(--paper); padding: 12px; border-radius: 10px; overflow-x: auto; white-space: pre; margin: 0; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
.resultado { font-size: 14px; }
.resultado ul { margin: 6px 0 0; padding-left: 18px; color: var(--urgente); }
.inactivo { opacity: .45; }

/* ============ login */
.login-fondo { min-height: 100vh; min-height: 100dvh; background: var(--ink); }
.login { min-height: 100vh; min-height: 100dvh; display: grid; align-content: center; gap: 22px; padding: 28px 22px; max-width: 420px; margin: 0 auto; }
.login-marca { text-align: center; color: var(--white); }
.login-marca p { margin: 10px 0 0; color: rgba(255,255,255,.6); font-weight: 500; font-size: 14px; }
.login .card { border-radius: 20px; padding: 26px 22px; border: 0; }
.logo-grande { display: flex; justify-content: center; }
.logo-grande img { width: 210px; max-width: 70%; height: auto; object-fit: contain; }
.logo-grande .logo-txt { font-size: 40px; color: var(--white); }

/* ============ toast y carga */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); z-index: 50;
  transform: translate(-50%, 16px); opacity: 0; transition: .25s;
  max-width: calc(100vw - 32px); padding: 13px 18px; border-radius: 13px; background: var(--ink); color: var(--white);
  font-weight: 600; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25);
  pointer-events: none;
}
.toast.ver { transform: translate(-50%, 0); opacity: 1; }
.cargando { display: grid; place-items: center; min-height: 50vh; }
.cargando::before { content: ""; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--paper-2); border-top-color: var(--ink); animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }

/* ============ v2.1: tareas, alertas, menú */
.nav-badge { position: absolute; top: 6px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--critico); color: var(--white); font-size: 10.5px; font-weight: 800; font-style: normal; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--white); }
.hint-tarea { display: flex; align-items: center; gap: 6px; margin: 10px 0 0 !important; font-size: 12.5px !important; font-weight: 600 !important; color: var(--critico); }
.hint-tarea svg { width: 15px; height: 15px; }

.fila-menu { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 15px 16px; background: var(--white); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); text-decoration: none; }
.fila-menu > svg { width: 22px; height: 22px; }
.fila-menu > span:nth-child(2) { flex: 1; display: grid; }
.fila-menu strong { font-family: var(--font-d); }
.fila-menu small { color: var(--soft); font-size: 12.5px; }

.t-estado { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); color: var(--soft); }
.t-estado svg { width: 17px; height: 17px; }
.t-estado.vencida { background: #fbe6e4; color: var(--critico); }
.t-estado.hoy { background: #fbf1df; color: var(--observado); }
.t-estado.cerrada { background: #e7f5ec; color: var(--aprobado); }
.t-venc.vencida { color: var(--critico); font-weight: 700; }
.t-venc.hoy { color: var(--observado); font-weight: 700; }
.fila.tarea .fila-txt strong { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
.estrella { color: var(--observado); display: grid; }
.estrella svg { width: 17px; height: 17px; fill: currentColor; }

.hero-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.chip-tarea { display: inline-flex; align-items: center; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: rgba(255,255,255,.12); color: var(--white); }
.chip-tarea.vencida { background: rgba(255,107,98,.18); color: var(--critico-cl); }
.chip-tarea.hoy { background: rgba(241,185,90,.18); color: var(--observado-cl); }
.chip-tarea.cerrada { background: rgba(82,208,140,.18); color: var(--aprobado-cl); }
.chip-estrella { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); background: none; color: rgba(255,255,255,.8); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.chip-estrella svg { width: 14px; height: 14px; }
.chip-estrella.on { border-color: var(--observado-cl); color: var(--observado-cl); }
.chip-estrella.on svg { fill: currentColor; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kpi { display: grid; gap: 2px; align-content: start; padding: 14px; background: var(--white); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); text-decoration: none; }
.kpi b { font-family: var(--font-d); font-size: 28px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12.5px; color: var(--soft); line-height: 1.3; }
.kpi.mal b { color: var(--critico); }
a.kpi:hover { border-color: var(--ink); }
@media (max-width: 560px) { .kpis { grid-template-columns: 1fr 1fr; } }

details.alerta { margin-bottom: 10px; }
details.alerta summary { gap: 14px; justify-content: flex-start; }
details.alerta summary::after { margin-left: auto; }
.alerta-n { flex: none; min-width: 38px; height: 38px; padding: 0 8px; border-radius: 11px; display: grid; place-items: center; background: var(--ink); color: var(--white); font-family: var(--font-d); font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
.alerta-n.cero { background: var(--paper-2); color: var(--mute); }
.alerta-txt { display: grid; gap: 1px; min-width: 0; }
.alerta-txt strong { font-size: 14.5px; }
.alerta-txt small { font-family: var(--font-b); font-weight: 400; font-size: 12.5px; color: var(--soft); }
details.alerta.vacia summary { cursor: default; }
details.alerta.vacia summary::after { display: none; }

.sel-filtros { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.sel-filtros select { min-height: 42px; font-size: 14px; }
.sel-acciones { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 6px; }
.sel-acciones .sub { margin-left: auto; font-weight: 600; color: var(--ink); }
.sel-lista { max-height: 380px; overflow-y: auto; border: 1px solid var(--paper-2); border-radius: 12px; }
.sel-fila { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--paper-2); cursor: pointer; }
.sel-fila:first-child { border-top: 0; }
.sel-fila input { width: 20px; height: 20px; flex: none; accent-color: var(--ink); }
.sel-fila:hover { background: #fafafa; }

.form label input, .form label textarea, .form label select { font-weight: 400; color: var(--ink); }
.form .foto-btn { display: inline-flex; grid-template-columns: none; gap: 6px; color: var(--ink); font-size: 13.5px; }
.form .check { color: var(--ink); }

/* ============ v2.2: secciones, parcial, firma */
.op.partial.sel { background: var(--observado); border-color: var(--observado); color: var(--white); }
.cap-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 12px; }
.cap-head h2 { margin: 0 !important; flex: 1 1 100%; }
.cap-head .na-btn { margin-left: auto; }
.cap-pts { font-size: 13px; font-weight: 700; color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 0 8px; }
.sec-head h3 { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--soft); text-transform: uppercase; letter-spacing: .06em; }
.na-btn { flex: none; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--white); color: var(--soft); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.na-btn.chico { min-height: 28px; padding: 0 10px; font-size: 12px; }
.na-btn.on { background: var(--ink); border-color: var(--ink); color: var(--white); }
.pts { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: var(--paper-2); color: var(--soft); font-size: 11px; font-weight: 700; vertical-align: 1px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.resp-top > .pts { margin: 3px 0 0; flex: none; }
.tag-parcial { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: #fbf1df; color: var(--observado); font-size: 11px; font-weight: 700; vertical-align: 1px; }
.ico.partial { background: var(--observado); }
.cap-fila small.sub { display: block; font-size: 12px; margin: 1px 0 0; }
.firma-card { margin-top: 6px; }
.firma-wrap { position: relative; border: 1.5px dashed var(--mute); border-radius: 12px; background: var(--paper); }
.firma-wrap canvas { display: block; width: 100%; height: 160px; touch-action: none; cursor: crosshair; border-radius: 12px; }
.firma-guia { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); font-size: 14px; pointer-events: none; }
.firma-card .btn.fantasma { justify-self: start; min-height: 34px; padding: 0 4px; }
.firma-ver img { display: block; max-width: 280px; width: 100%; height: auto; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.firma-ver p { margin: 0; font-weight: 600; }


/* ============ v2.3: cuenta y administración */
body.con-hoja { overflow: hidden; }
.hoja-fondo { position: fixed; inset: 0; z-index: 60; background: rgba(10,10,10,0); display: flex; align-items: flex-end; justify-content: center; transition: background .2s; }
.hoja-fondo.ver { background: rgba(10,10,10,.45); }
.hoja { width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; background: var(--white); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.2); transform: translateY(100%); transition: transform .22s ease; padding-bottom: env(safe-area-inset-bottom); }
.hoja-fondo.ver .hoja { transform: none; }
@media (min-width: 700px) {
  .hoja-fondo { align-items: center; }
  .hoja { border-radius: 20px; transform: translateY(20px) scale(.98); opacity: 0; transition: transform .2s, opacity .2s; }
  .hoja-fondo.ver .hoja { transform: none; opacity: 1; }
}
.hoja-top { display: flex; align-items: center; gap: 12px; padding: 18px 20px 12px; border-bottom: 1px solid var(--paper-2); }
.hoja-top h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 800; }
.hoja-x { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--paper); display: grid; place-items: center; cursor: pointer; color: var(--soft); }
.hoja-x svg { width: 16px; height: 16px; }
.hoja-cuerpo { padding: 18px 20px; overflow-y: auto; }
.hoja-pie { display: flex; gap: 10px; padding: 12px 20px 18px; border-top: 1px solid var(--paper-2); }
.hoja-pie .primario { flex: 1; }
.btn.peligro { color: var(--critico); }
.campo { display: grid; gap: 8px; }
.campo-lbl { font-weight: 600; font-size: 13px; color: var(--soft); }
.ayuda { color: var(--mute); font-size: 12.5px; line-height: 1.4; }
.solo-lectura { color: var(--mute) !important; background: var(--paper-2) !important; }
.dos-campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.segmento { display: flex; gap: 4px; padding: 4px; background: var(--paper); border-radius: 12px; border: 1.5px solid var(--line); }
.segmento button { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: none; font-weight: 600; font-size: 14px; color: var(--soft); cursor: pointer; }
.segmento button.sel { background: var(--ink); color: var(--white); }
.interruptor { display: flex !important; align-items: center; gap: 12px; font-weight: 500 !important; color: var(--ink) !important; font-size: 14px !important; cursor: pointer; }
.interruptor input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.interruptor span { flex: none; width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; transition: background .2s; }
.interruptor span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.interruptor input:checked + span { background: var(--ink); }
.interruptor input:checked + span::after { transform: translateX(18px); }
.interruptor input:focus-visible + span { outline: 2.5px solid var(--ink); outline-offset: 2px; }
.interruptor.chico { font-size: 13px !important; color: var(--soft) !important; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--white); display: grid; place-items: center; cursor: pointer; }
.stepper button svg { width: 18px; height: 18px; }
.stepper input { width: 80px !important; text-align: center; font-family: var(--font-d); font-weight: 800; font-size: 18px !important; }
.ubic-acciones { display: flex; gap: 8px; flex-wrap: wrap; }
.buscar.chico input { min-height: 40px; font-size: 14px; }
.sel-lista.chica { max-height: 220px; }
.ok-box { margin-top: 4px; padding: 12px; border-radius: 10px; background: var(--paper); }

.adm-barra { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.adm-barra .buscar { flex: 1; }
.adm-barra .interruptor { flex: 1; }
.adm-barra .btn { flex: none; }
@media (max-width: 420px) { .adm-barra .btn:not(.con-texto) span { display: none; } .adm-barra .btn:not(.con-texto) { width: 48px; padding: 0; } }
.form label.sel-fila { display: flex; align-items: center; gap: 12px; font-weight: 400; font-size: 14px; color: var(--ink); }
.form label.sel-fila .fila-txt strong { font-weight: 600; }
.form label.sel-fila .fila-txt small { font-weight: 400; }
.adm-lista { background: var(--white); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); margin-top: 6px; }
.adm-fila { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--paper-2); background: none; text-align: left; cursor: pointer; }
.adm-fila:first-child { border-top: 0; }
.adm-fila:hover { background: #fafafa; }
.avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); color: var(--ink); font-family: var(--font-d); font-weight: 800; font-size: 14px; }
.avatar.r-admin { background: var(--ink); color: var(--white); }
.avatar.r-jefe { background: #e6e0d6; }
.avatar.grande { width: 64px; height: 64px; font-size: 22px; }
.rol-chip { flex: none; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--paper-2); color: var(--soft); }
.rol-chip.r-admin { background: var(--ink); color: var(--white); }
.rol-chip.r-jefe { background: #efe9df; color: #6b5a3c; }
.inactivo .rol-chip { background: #fbe6e4; color: var(--critico); }
.codigo-chip { flex: none; min-width: 58px; padding: 5px 8px; border-radius: 8px; background: var(--ink); color: var(--white); font-family: var(--font-d); font-weight: 800; font-size: 12px; text-align: center; letter-spacing: .02em; }
.aviso-chip { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #fbf1df; color: var(--observado); }
.aviso-chip svg { width: 15px; height: 15px; }
.adm-masivo { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; padding: 14px; border: 1.5px dashed var(--line); border-radius: var(--r); background: none; color: var(--soft); font-weight: 600; font-size: 13.5px; cursor: pointer; }
.adm-masivo:hover { border-color: var(--mute); color: var(--ink); }
.adm-masivo svg { width: 17px; height: 17px; transform: rotate(180deg); }
.drive-card { display: flex; align-items: center; gap: 12px; margin-top: 28px; padding: 14px 16px; border-radius: var(--r); background: var(--paper-2); }
.drive-card > div { flex: 1; min-width: 0; }
.drive-card strong { font-size: 14px; }

.ck-num { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--paper-2); display: grid; place-items: center; font-family: var(--font-d); font-weight: 800; font-size: 13px; }

.icono-btn { width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--white); display: grid; place-items: center; cursor: pointer; color: var(--soft); flex: none; }

.ck-sec { padding: 14px 16px 4px; font-size: 11.5px; font-weight: 700; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }

.ck-item-txt { flex: 1; min-width: 0; display: grid; gap: 5px; padding: 10px 12px; border: 0; border-radius: 10px; background: none; text-align: left; cursor: pointer; font-size: 14px; }

.ck-agregar { width: calc(100% - 24px); margin: 8px 12px 14px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: 1.5px dashed var(--line); border-radius: 12px; background: none; color: var(--soft); font-weight: 600; font-size: 13.5px; cursor: pointer; }

.perfil { display: flex; align-items: center; gap: 16px; padding: 22px 20px; border-radius: 20px; background: linear-gradient(155deg, var(--ink) 0%, #26262a 100%); color: var(--white); }

.menu { margin-top: 18px; background: var(--white); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
